<svg xmlns="http://www.w3.org/2000/svg" width="290" height="500" viewBox="0 0 290 500" role="img" aria-label="барш овгм бйиез">
  <rect width="290" height="500" fill="#0b3a66"/>
  <rect y="0" width="290" height="8" fill="#c4091e"/>
  <text x="145" y="48" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15">бйиез шлб</text>
  <text x="145" y="120" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="800">ъек</text>
  <text x="145" y="168" text-anchor="middle" fill="#ffd54a" font-family="Arial, sans-serif" font-size="42" font-weight="800">щрйеъ</text>
  <text x="145" y="230" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">оъайойн млн слен</text>
  <text x="145" y="258" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">роек мбйиез шлб</text>
  <rect x="48" y="300" width="194" height="120" rx="8" fill="#123f6b" stroke="#7eb6e8" stroke-width="2"/>
  <text x="145" y="348" text-anchor="middle" fill="#7eb6e8" font-family="Arial, sans-serif" font-size="14">мма дъзййбеъ</text>
  <text x="145" y="392" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800">дшлб щмлн</text>
  <rect x="55" y="440" rx="22" width="180" height="40" fill="#c4091e"/>
  <text x="145" y="466" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">мфшийн мзце лап</text>
</svg>
