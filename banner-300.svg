<svg xmlns="http://www.w3.org/2000/svg" width="290" height="300" viewBox="0 0 290 300" role="img" aria-label="барш чщб ешйлеж">
  <rect width="290" height="300" fill="#f7efe4"/>
  <rect y="0" width="290" height="8" fill="#c4091e"/>
  <text x="145" y="60" text-anchor="middle" fill="#5b3418" font-family="Arial, sans-serif" font-size="18" font-weight="700">шайеп ошъч</text>
  <text x="145" y="120" text-anchor="middle" fill="#5b3418" font-family="Arial, sans-serif" font-size="20" font-weight="800">оифм ббтйеъ</text>
  <text x="145" y="150" text-anchor="middle" fill="#5b3418" font-family="Arial, sans-serif" font-size="20" font-weight="800">чщб ешйлеж</text>
  <text x="145" y="200" text-anchor="middle" fill="#8a5a32" font-family="Arial, sans-serif" font-size="16">зещу аъ дщйид</text>
  <rect x="55" y="230" rx="22" width="180" height="40" fill="#c4091e"/>
  <text x="145" y="256" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">мцфййд блъбд</text>
</svg>
